name: Release

# On a version tag (v0.1.0, ...): build every package, sign the APT archive,
# build the ISO, and attach the ISO and checksums to a GitHub Release.
# Publishing the archive to GitHub Pages is off until the repository variable
# DOTOS_PUBLISH_REPO is set to "true" (see docs/RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        run: scripts/build-debs.sh

      - name: Sign the APT archive
        env:
          DOTOS_SIGNING_KEY: ${{ secrets.DOTOS_SIGNING_KEY }}
        run: scripts/build-repo.sh

      - name: Build the ISO
        run: scripts/build-iso.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS

      - name: Publish the APT archive to GitHub Pages
        if: vars.DOTOS_PUBLISH_REPO == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out/repo
          publish_branch: gh-pages
          keep_files: false
