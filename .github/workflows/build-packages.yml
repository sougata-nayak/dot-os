name: Build theme packages

# Builds every Debian package under packages/ on each push and pull request,
# so a broken debian/ directory or generator is caught immediately.

on:
  push:
    branches: [main]
    paths: ["packages/**", "tools/**", "design-system/tokens.json", "scripts/build-debs.sh", ".github/workflows/build-packages.yml"]
  pull_request:
    paths: ["packages/**", "tools/**", "design-system/tokens.json", "scripts/build-debs.sh", ".github/workflows/build-packages.yml"]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Generated theme files are up to date
        run: python3 tools/generate.py --check

      - name: Build all packages in Debian 13
        run: scripts/build-debs.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/debs/*.deb
