# DOT OS installer sequence. Replaces Debian's /etc/calamares/settings.conf
# (kept as settings.conf.debian by dpkg-divert) with the same jobs, but the
# QML pages (welcomeq, localeq, keyboardq, usersq, summaryq, finishedq) that
# carry the DOT OS design, and a bootloader instance that names the EFI entry.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       dotos
  module:   bootloader
  config:   bootloader-dotos.conf

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
  - summaryq
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - localeq
  - keyboardq
  - localecfg
  - usersq
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader@dotos
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finishedq

branding: dot-os
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
# Once files are being written, stopping half-way leaves a broken disk.
disable-cancel-during-exec: true
quit-at-end: false
