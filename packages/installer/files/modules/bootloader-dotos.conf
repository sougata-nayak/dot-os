# Debian's bootloader settings, plus the EFI directory and firmware entry
# name. "dot" is what grub-install derives from GRUB_DISTRIBUTOR="DOT OS"
# (lower case, first word), so later grub-efi-arm64 upgrades reinstall into
# the same EFI/dot directory instead of adding a second entry.
---
efiBootLoader: "grub"
efiBootloaderId: "dot"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
