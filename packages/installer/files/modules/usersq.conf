# Debian's account settings (root stays locked; the user gets sudo).
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
doAutologin:     false
hostname:
    location:        EtcFile
    writeHostsFile:  true
    template:        "dot-${login}"
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
qmlSearch: both
