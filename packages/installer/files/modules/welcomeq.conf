# Checks shown on the Welcome step (boards/InstallWelcome.dc.html). The
# sizes match the numbers welcomeq.qml prints.
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    true
requirements:
    requiredStorage:    12
    requiredRam:        2.0
    internetCheckUrl:   http://deb.debian.org/debian/
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root
qmlSearch: both
