<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cursor theme</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dotos/components/bundle.css">
<link rel="stylesheet" href="dot.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="nil dot-sheet {{theme}}" style="width: 1280px; height: 800px; box-sizing: border-box; display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 64px">

<div style="display: flex; flex-direction: column; gap: 32px">
<div>
<div class="nil-label" style="margin-bottom: 12px">Default arrow — hotspot at the tip</div>
<div class="dot-cell" style="width: 320px; height: 280px; background: var(--surface)">
<svg viewBox="0 0 24 24" width="216" height="216" role="img" aria-label="Arrow cursor, enlarged">
<path class="dot-cur" d="M5 3v16l4.5-4 3 6.5 2.5-1.2-3-6.3H18z" style="stroke-width: 0.5"></path>
<circle cx="5" cy="3" r="0.6" style="fill: var(--accent)"></circle>
</svg>
</div>
</div>
<ul class="nil-list">
<li class="nil-row"><span class="nil-label">Fill</span><span class="nil-row__value">text-display</span></li>
<li class="nil-row"><span class="nil-label">Outline</span><span class="nil-row__value">1 px black</span></li>
<li class="nil-row"><span class="nil-label">Shadow</span><span class="nil-row__value">none</span></li>
<li class="nil-row"><span class="nil-label">Sizes</span><span class="nil-row__value">24, 32, 48</span></li>
<li class="nil-row"><span class="nil-label">Busy</span><span class="nil-row__value">8 segments, stepped</span></li>
<li class="nil-row"><span class="nil-label">Light theme</span><span class="nil-row__value">inverted</span></li>
</ul>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-content: start">

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" d="M5 3v16l4.5-4 3 6.5 2.5-1.2-3-6.3H18z"></path></svg></div><span class="nil-label">default</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10l5.2 1a2 2 0 0 1 1.6 2.2l-.6 5A3 3 0 0 1 15.2 21H11a3 3 0 0 1-2.4-1.2L5 15l1-1a1.5 1.5 0 0 1 2 0l1 1z"></path></svg></div><span class="nil-label">pointer</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" d="M9 3h6v2h-2v14h2v2H9v-2h2V5H9z"></path></svg></div><span class="nil-label">text</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" d="M11 3h2v8h8v2h-8v8h-2v-8H3v-2h8z"></path></svg></div><span class="nil-label">crosshair</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" d="M12 2l3.5 4H13v5h5V8.5l4 3.5-4 3.5V13h-5v5h2.5L12 22l-3.5-4H11v-5H6v2.5L2 12l4-3.5V11h5V6H8.5z"></path></svg></div><span class="nil-label">move</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" d="M2 12l5-4.5V11h10V7.5l5 4.5-5 4.5V13H7v3.5z"></path></svg></div><span class="nil-label">ew-resize</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" transform="rotate(90 12 12)" d="M2 12l5-4.5V11h10V7.5l5 4.5-5 4.5V13H7v3.5z"></path></svg></div><span class="nil-label">ns-resize</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" transform="rotate(45 12 12)" d="M2 12l5-4.5V11h10V7.5l5 4.5-5 4.5V13H7v3.5z"></path></svg></div><span class="nil-label">nwse-resize</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" transform="rotate(-45 12 12)" d="M2 12l5-4.5V11h10V7.5l5 4.5-5 4.5V13H7v3.5z"></path></svg></div><span class="nil-label">nesw-resize</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><circle cx="12" cy="12" r="8" style="fill: none; stroke: var(--black); stroke-width: 4.5"></circle><path d="M6.4 6.4l11.2 11.2" style="fill: none; stroke: var(--black); stroke-width: 4.5"></path><circle cx="12" cy="12" r="8" style="fill: none; stroke: var(--text-display); stroke-width: 2.5"></circle><path d="M6.4 6.4l11.2 11.2" style="fill: none; stroke: var(--text-display); stroke-width: 2.5"></path></svg></div><span class="nil-label">not-allowed</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><rect class="dot-cur" x="10.5" y="3" width="3" height="3"></rect><rect class="dot-cur" x="15.8" y="5.2" width="3" height="3"></rect><rect class="dot-cur" x="18" y="10.5" width="3" height="3"></rect><rect class="dot-cur" x="15.8" y="15.8" width="3" height="3" style="fill: var(--text-secondary)"></rect><rect class="dot-cur" x="10.5" y="18" width="3" height="3" style="fill: var(--text-secondary)"></rect><rect class="dot-cur" x="5.2" y="15.8" width="3" height="3" style="fill: var(--text-secondary)"></rect><rect class="dot-cur" x="3" y="10.5" width="3" height="3" style="fill: var(--text-secondary)"></rect><rect class="dot-cur" x="5.2" y="5.2" width="3" height="3" style="fill: var(--text-secondary)"></rect></svg></div><span class="nil-label">wait</span></div>

<div style="display: flex; flex-direction: column; gap: 12px"><div class="dot-cell" style="height: 160px; background: var(--surface)"><svg viewBox="0 0 24 24" width="72" height="72" aria-hidden="true"><path class="dot-cur" transform="scale(.75)" d="M5 3v16l4.5-4 3 6.5 2.5-1.2-3-6.3H18z"></path><rect class="dot-cur" x="16.5" y="12.5" width="2" height="2" style="stroke-width: 0.5"></rect><rect class="dot-cur" x="19.3" y="13.7" width="2" height="2" style="stroke-width: 0.5"></rect><rect class="dot-cur" x="20.5" y="16.5" width="2" height="2" style="stroke-width: 0.5"></rect><rect class="dot-cur" x="19.3" y="19.3" width="2" height="2" style="fill: var(--text-secondary); stroke-width: 0.5"></rect><rect class="dot-cur" x="16.5" y="20.5" width="2" height="2" style="fill: var(--text-secondary); stroke-width: 0.5"></rect><rect class="dot-cur" x="13.7" y="19.3" width="2" height="2" style="fill: var(--text-secondary); stroke-width: 0.5"></rect><rect class="dot-cur" x="12.5" y="16.5" width="2" height="2" style="fill: var(--text-secondary); stroke-width: 0.5"></rect><rect class="dot-cur" x="13.7" y="13.7" width="2" height="2" style="fill: var(--text-secondary); stroke-width: 0.5"></rect></svg></div><span class="nil-label">progress</span></div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme === 'light' ? 'dot-light' : 'dot-dark' };
}
}
</script>
</body>
</html>
