<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session splash</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dotos/components/bundle.css">
<link rel="stylesheet" href="dot.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&amp;family=Space+Grotesk:wght@300..700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="nil dot-screen {{theme}}" style="width: 1280px; height: 800px">
<div style="position: absolute; left: 32px; top: 32px" class="nil-label">Session — sougata@dot</div>
<div style="position: absolute; right: 32px; top: 32px" class="nil-label">Plasma (Wayland)</div>
<div style="position: absolute; left: 32px; bottom: 32px; width: 320px">
<div class="nil-display" style="font-size: 72px; white-space: nowrap">DOT OS</div>
<div class="nil-meter" style="margin-top: 32px">
<div class="nil-seg nil-seg--hero dot-seg--live" role="progressbar" aria-label="Starting session" aria-valuenow="4" aria-valuemin="0" aria-valuemax="6"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
<div class="nil-meter__head"><span class="nil-label">Starting desktop</span><span class="nil-caption">4 / 6</span></div>
</div>
</div>
<div style="position: absolute; right: 32px; bottom: 32px; text-align: right" class="nil-label">Same position as the boot splash<br>6 segments, one per KSplash stage</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme === 'light' ? 'dot-light' : 'dot-dark' };
}
}
</script>
</body>
</html>
