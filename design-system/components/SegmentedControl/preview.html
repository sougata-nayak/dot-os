<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap">
<style>html,body{margin:0}body{padding:24px;background:var(--black)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-md)}.col{display:flex;flex-direction:column;gap:var(--space-lg);max-width:360px}</style>
</head><body class="nil">
<div class="row"><div class="nil-segmented" role="group" aria-label="Appearance"><button aria-pressed="true">Dark</button><button aria-pressed="false">Light</button><button aria-pressed="false">Auto</button></div></div>
<script>document.querySelectorAll('.nil-segmented').forEach(function(g){g.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')return;g.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b===e.target)})})})</script>
</body></html>
