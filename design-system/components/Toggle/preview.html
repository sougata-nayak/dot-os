<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap">
<style>html,body{margin:0}body{padding:24px;background:var(--black)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-md)}.col{display:flex;flex-direction:column;gap:var(--space-lg);max-width:360px}</style>
</head><body class="nil">
<div class="col" style="gap:var(--space-md)">
<div class="row" style="justify-content:space-between"><span>Night light</span><button class="nil-toggle" role="switch" aria-checked="true" aria-label="Night light"></button></div>
<div class="row" style="justify-content:space-between"><span>Tap to click</span><button class="nil-toggle" role="switch" aria-checked="false" aria-label="Tap to click"></button></div>
</div>
<script>document.querySelectorAll('.nil-toggle').forEach(function(t){t.addEventListener('click',function(){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true')})})</script>
</body></html>
