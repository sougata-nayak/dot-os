<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap">
<style>
html,body{margin:0}
.cover{position:relative;width:960px;height:288px;background:var(--black);overflow:hidden}
svg{position:absolute;inset:0}
.slab{fill:var(--text-display)} .block{fill:var(--border-visible);rx:var(--radius-card)} .chip{fill:var(--text-secondary)}
.dot{fill:var(--black)} .signal{fill:var(--accent)}
.txt{position:absolute;left:var(--space-xl);bottom:var(--space-xl);max-width:440px}
.name{font-family:var(--font-display);font-weight:700;font-size:112px;line-height:.95;letter-spacing:-.03em;color:var(--text-display);white-space:nowrap}
.tag{margin-top:var(--space-md);font-family:var(--font-mono);font-size:13px;line-height:1.4;color:var(--text-secondary)}

<div class="cover">
