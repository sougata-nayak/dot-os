// Build time only: live-build copies this to /etc/apt/apt.conf while it builds
// the image and deletes it at the end, so it is not in the shipped image.
//
// The image is built from the .deb files in config/packages.chroot. The DOT OS
// archive is also a package source in the image (dot-os-archive-keyring), so
// apt sees a second copy of every DOT OS package with the same version number
// and treats replacing the installed copy with live-build's local one as a
// downgrade. It is the same version, so the "downgrade" changes nothing, but
// live-build's final dist-upgrade runs with -y and would stop on it.
APT::Get::allow-downgrades "true";
