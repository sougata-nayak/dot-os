# DOT OS live boot menu settings (replaces live-build's config.cfg).
set default=0
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
	font=unicode
else
	font=$prefix/unicode.pf2
fi
loadfont $font

set gfxmode=1920x1080,1280x800,auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

source /boot/grub/theme.cfg
