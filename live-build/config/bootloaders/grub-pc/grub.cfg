source /boot/grub/config.cfg

menuentry "DOT OS — live session" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "DOT OS — live session, safe graphics" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "DOT OS — live session, boot messages" --hotkey=m {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ plymouth.enable=0 systemd.show_status=1
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI firmware settings" --hotkey=f {
		fwsetup
	}
fi
